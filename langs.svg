<svg width="380" height="220" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages for MayankBuilds21">
<defs>
  <linearGradient id="lGrad1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff6ec7"/><stop offset="100%" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="lGrad2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
  <linearGradient id="lGrad3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
  <linearGradient id="lGrad4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
  <linearGradient id="lGrad5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <clipPath id="lRound"><rect width="380" height="220" rx="18"/></clipPath>
  <style>.sans{font-family:'Segoe UI',Roboto,Arial,sans-serif;}</style>
</defs>
<g clip-path="url(#lRound)">
  <rect width="380" height="220" fill="#0b0714"/>
  <rect width="380" height="220" fill="none" stroke="#7c3aed" stroke-opacity="0.4"/>
  <text x="20" y="30" class="sans" font-size="15" font-weight="700" fill="#ffffff">Most Used Languages</text>

  <g transform="translate(20,52)" class="sans" font-size="11">
    <text y="0" fill="#e3d6ff">TypeScript</text><text x="320" y="0" text-anchor="end" fill="#c9b8ff">38.2%</text>
    <rect y="8" width="320" height="7" rx="3.5" fill="#241436"/>
    <rect y="8" width="0" height="7" rx="3.5" fill="url(#lGrad1)"><animate attributeName="width" to="122" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>

    <text y="34" fill="#e3d6ff">JavaScript</text><text x="320" y="34" text-anchor="end" fill="#c9b8ff">24.6%</text>
    <rect y="42" width="320" height="7" rx="3.5" fill="#241436"/>
    <rect y="42" width="0" height="7" rx="3.5" fill="url(#lGrad4)"><animate attributeName="width" to="79" dur="1.2s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>

    <text y="68" fill="#e3d6ff">CSS</text><text x="320" y="68" text-anchor="end" fill="#c9b8ff">15.1%</text>
    <rect y="76" width="320" height="7" rx="3.5" fill="#241436"/>
    <rect y="76" width="0" height="7" rx="3.5" fill="url(#lGrad3)"><animate attributeName="width" to="48" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>

    <text y="102" fill="#e3d6ff">Python</text><text x="320" y="102" text-anchor="end" fill="#c9b8ff">12.4%</text>
    <rect y="110" width="320" height="7" rx="3.5" fill="#241436"/>
    <rect y="110" width="0" height="7" rx="3.5" fill="url(#lGrad5)"><animate attributeName="width" to="40" dur="1.2s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>

    <text y="136" fill="#e3d6ff">Other</text><text x="320" y="136" text-anchor="end" fill="#c9b8ff">9.7%</text>
    <rect y="144" width="320" height="7" rx="3.5" fill="#241436"/>
    <rect y="144" width="0" height="7" rx="3.5" fill="url(#lGrad2)"><animate attributeName="width" to="31" dur="1.2s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
  </g>
  <text x="360" y="212" text-anchor="end" font-size="9" fill="#5a4778" class="sans">edit values in langs.svg</text>
</g>
</svg>
