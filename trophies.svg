<svg width="820" height="180" viewBox="0 0 820 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub trophies for MayankBuilds21">
<defs>
  <linearGradient id="tGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe38a"/><stop offset="100%" stop-color="#d89a2a"/></linearGradient>
  <linearGradient id="tPink" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff9fe0"/><stop offset="100%" stop-color="#ff6ec7"/></linearGradient>
  <linearGradient id="tPurple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="shineT" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="trRound"><rect width="820" height="180" rx="18"/></clipPath>
  <style>.sans{font-family:'Segoe UI',Roboto,Arial,sans-serif;}</style>
</defs>
<g clip-path="url(#trRound)">
  <rect width="820" height="180" fill="#0b0714"/>
  <rect width="820" height="180" fill="none" stroke="#7c3aed" stroke-opacity="0.4"/>

  <!-- 5 trophy cells popping into place -->
  <g transform="translate(30,20)">
    <g transform="scale(0)" opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="0.45s" begin="0.2s" fill="freeze" additive="replace" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <animate attributeName="opacity" to="1" dur="0.3s" begin="0.2s" fill="freeze"/>
      <rect width="140" height="140" rx="14" fill="#150a22" stroke="url(#tGold)" stroke-width="1.5"/>
      <circle cx="70" cy="52" r="26" fill="url(#tGold)"/>
      <rect x="60" y="76" width="20" height="14" fill="url(#tGold)"/>
      <rect x="46" y="90" width="48" height="10" rx="3" fill="url(#tGold)"/>
      <text x="70" y="58" text-anchor="middle" font-size="16" fill="#3a2200">1</text>
      <text x="70" y="118" text-anchor="middle" class="sans" font-size="11" fill="#ffe38a">Pull Shark</text>
      <text x="70" y="132" text-anchor="middle" class="sans" font-size="9" fill="#a08a5a">GOLD</text>
      <rect x="-140" y="0" width="60" height="140" fill="url(#shineT)" transform="skewX(-20)"><animate attributeName="x" from="-140" to="220" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(184,20)">
    <g transform="scale(0)" opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="0.45s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <animate attributeName="opacity" to="1" dur="0.3s" begin="0.35s" fill="freeze"/>
      <rect width="140" height="140" rx="14" fill="#150a22" stroke="url(#tPink)" stroke-width="1.5"/>
      <circle cx="70" cy="52" r="26" fill="url(#tPink)"/>
      <rect x="60" y="76" width="20" height="14" fill="url(#tPink)"/>
      <rect x="46" y="90" width="48" height="10" rx="3" fill="url(#tPink)"/>
      <text x="70" y="118" text-anchor="middle" class="sans" font-size="11" fill="#ffb6ea">YOLO</text>
      <text x="70" y="132" text-anchor="middle" class="sans" font-size="9" fill="#c77aac">SILVER</text>
      <rect x="-140" y="0" width="60" height="140" fill="url(#shineT)" transform="skewX(-20)"><animate attributeName="x" from="-140" to="220" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(338,20)">
    <g transform="scale(0)" opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="0.45s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <animate attributeName="opacity" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>
      <rect width="140" height="140" rx="14" fill="#150a22" stroke="url(#tPurple)" stroke-width="1.5"/>
      <circle cx="70" cy="52" r="26" fill="url(#tPurple)"/>
      <rect x="60" y="76" width="20" height="14" fill="url(#tPurple)"/>
      <rect x="46" y="90" width="48" height="10" rx="3" fill="url(#tPurple)"/>
      <text x="70" y="118" text-anchor="middle" class="sans" font-size="11" fill="#e3c6ff">Quickdraw</text>
      <text x="70" y="132" text-anchor="middle" class="sans" font-size="9" fill="#a98ad1">BRONZE</text>
      <rect x="-140" y="0" width="60" height="140" fill="url(#shineT)" transform="skewX(-20)"><animate attributeName="x" from="-140" to="220" dur="2.6s" begin="1.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(492,20)">
    <g transform="scale(0)" opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="0.45s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <animate attributeName="opacity" to="1" dur="0.3s" begin="0.65s" fill="freeze"/>
      <rect width="140" height="140" rx="14" fill="#150a22" stroke="url(#tGold)" stroke-width="1.5"/>
      <circle cx="70" cy="52" r="26" fill="url(#tGold)"/>
      <rect x="60" y="76" width="20" height="14" fill="url(#tGold)"/>
      <rect x="46" y="90" width="48" height="10" rx="3" fill="url(#tGold)"/>
      <text x="70" y="118" text-anchor="middle" class="sans" font-size="11" fill="#ffe38a">Starstruck</text>
      <text x="70" y="132" text-anchor="middle" class="sans" font-size="9" fill="#a08a5a">GOLD</text>
      <rect x="-140" y="0" width="60" height="140" fill="url(#shineT)" transform="skewX(-20)"><animate attributeName="x" from="-140" to="220" dur="2.6s" begin="2s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(646,20)">
    <g transform="scale(0)" opacity="0">
      <animateTransform attributeName="transform" type="scale" from="0" to="1" dur="0.45s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      <animate attributeName="opacity" to="1" dur="0.3s" begin="0.8s" fill="freeze"/>
      <rect width="140" height="140" rx="14" fill="#150a22" stroke="url(#tPink)" stroke-width="1.5"/>
      <circle cx="70" cy="52" r="26" fill="url(#tPink)"/>
      <rect x="60" y="76" width="20" height="14" fill="url(#tPink)"/>
      <rect x="46" y="90" width="48" height="10" rx="3" fill="url(#tPink)"/>
      <text x="70" y="118" text-anchor="middle" class="sans" font-size="11" fill="#ffb6ea">Deep Diver</text>
      <text x="70" y="132" text-anchor="middle" class="sans" font-size="9" fill="#c77aac">SILVER</text>
      <rect x="-140" y="0" width="60" height="140" fill="url(#shineT)" transform="skewX(-20)"><animate attributeName="x" from="-140" to="220" dur="2.6s" begin="2.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <text x="800" y="172" text-anchor="end" font-size="9" fill="#5a4778" class="sans">edit cells in trophies.svg</text>
</g>
</svg>
