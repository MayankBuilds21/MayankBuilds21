<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats for MayankBuilds21">
<defs>
  <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="sGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sRound"><rect width="480" height="220" rx="18"/></clipPath>
  <style>.mono{font-family:'SFMono-Regular',Consolas,Menlo,monospace;} .sans{font-family:'Segoe UI',Roboto,Arial,sans-serif;}</style>
</defs>
<g clip-path="url(#sRound)">
  <rect width="480" height="220" fill="#0b0714"/>
  <rect width="480" height="220" fill="none" stroke="#7c3aed" stroke-opacity="0.4"/>
  <text x="20" y="34" class="sans" font-size="16" font-weight="700" fill="#ffffff">Mayank Jha's GitHub Stats</text>

  <!-- rank ring -->
  <g transform="translate(90,130)">
    <circle r="58" fill="none" stroke="#241436" stroke-width="10"/>
    <circle r="58" fill="none" stroke="url(#sGrad)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="364" stroke-dashoffset="364" transform="rotate(-90)" filter="url(#sGlow)">
      <animate attributeName="stroke-dashoffset" from="364" to="62" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <text x="0" y="-2" text-anchor="middle" class="sans" font-size="22" font-weight="800" fill="#ffffff">A+</text>
    <text x="0" y="18" text-anchor="middle" class="sans" font-size="10" fill="#c9b8ff">RANK</text>
  </g>

  <!-- stat rows sliding upward with counting -->
  <g transform="translate(190,64)" class="sans" font-size="13" fill="#e3d6ff">
    <g opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,16;0,0" dur="0.5s" begin="0.4s" fill="freeze"/>
      <text x="0" y="0">&#11088; Total Stars Earned</text><text x="270" y="0" text-anchor="end" fill="#ff9fe0" font-weight="700">128</text>
    </g>
    <g transform="translate(0,34)" opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,50;0,34" dur="0.5s" begin="0.6s" fill="freeze"/>
      <text x="0" y="0">&#128218; Total Commits (2026)</text><text x="270" y="0" text-anchor="end" fill="#ff9fe0" font-weight="700">1,942</text>
    </g>
    <g transform="translate(0,68)" opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,84;0,68" dur="0.5s" begin="0.8s" fill="freeze"/>
      <text x="0" y="0">&#128257; Total PRs</text><text x="270" y="0" text-anchor="end" fill="#ff9fe0" font-weight="700">214</text>
    </g>
    <g transform="translate(0,102)" opacity="0"><animate attributeName="opacity" to="1" dur="0.5s" begin="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,118;0,102" dur="0.5s" begin="1s" fill="freeze"/>
      <text x="0" y="0">&#127919; Contributed to</text><text x="270" y="0" text-anchor="end" fill="#ff9fe0" font-weight="700">18 repos</text>
    </g>
  </g>
  <text x="460" y="212" text-anchor="end" class="mono" font-size="9" fill="#5a4778">edit values in stats.svg</text>
</g>
</svg>
