<svg width="380" height="620" viewBox="0 0 380 620" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Mayank Jha ID lanyard">
<title>Mayank Jha - ID Badge</title>
<defs>
  <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1b1030"/>
    <stop offset="100%" stop-color="#241540"/>
  </linearGradient>
  <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
    <stop offset="60%" stop-color="#ff6ec7" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="cardShadow2" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <clipPath id="avatarClip"><circle cx="0" cy="0" r="55"/></clipPath>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  </style>
</defs>

<!-- fixed strap anchor at top of viewport -->
<line x1="190" y1="0" x2="190" y2="70" stroke="url(#strapGrad)" stroke-width="26"/>
<circle cx="190" cy="0" r="14" fill="#8b2f6b"/>

<!-- swinging assembly: drop then damped pendulum then gentle infinite sway -->
<g id="pivot" transform="translate(190,70)">
  <g id="swingGroup">
    <animateTransform id="dropAnim" attributeName="transform" type="translate"
      values="0,-260;0,-260;0,10;0,-14;0,4;0,0" keyTimes="0;0.05;0.55;0.72;0.88;1"
      dur="1.4s" begin="0s" fill="freeze" calcMode="spline"
      keySplines="0 0 1 1;0.3 0 0.2 1;0.3 0 0.2 1;0.3 0 0.2 1;0.3 0 0.2 1"/>
    <animateTransform id="swing1" attributeName="transform" type="rotate" additive="sum"
      values="0;16;-12;9;-6;4;-2;1;0" keyTimes="0;0.12;0.28;0.42;0.56;0.7;0.84;0.94;1"
      dur="2.6s" begin="dropAnim.end" fill="freeze" calcMode="spline"
      keySplines="0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;2.5;-2.5;0" dur="4.2s" begin="swing1.end" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- clasp + strap remainder attached to card -->
    <rect x="-8" y="0" width="16" height="26" rx="4" fill="#c9c9d6" stroke="#8a8a99"/>
    <circle cx="0" cy="30" r="9" fill="none" stroke="#c9c9d6" stroke-width="4"/>
    <rect x="-5" y="34" width="10" height="14" fill="#c9c9d6"/>

    <!-- card body -->
    <g transform="translate(0,48)">
      <rect x="-150" y="0" width="300" height="420" rx="20" fill="url(#cardGrad)" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="-150" y="0" width="300" height="420" rx="20" fill="none" stroke="url(#strapGrad)" stroke-width="1.5" opacity="0.6"/>

      <!-- header strip -->
      <text x="0" y="34" text-anchor="middle" class="mono" font-size="11" fill="#c9b8ff" letter-spacing="3">DEVELOPER ID</text>

      <!-- avatar glow ring -->
      <circle cx="0" cy="110" r="66" fill="url(#ringGlow)" filter="url(#soft)"/>
      <circle cx="0" cy="110" r="58" fill="none" stroke="url(#strapGrad)" stroke-width="3"/>
      <g clip-path="url(#avatarClip)" transform="translate(0,110)">
        <rect x="-55" y="-55" width="110" height="110" fill="#2a1a44"/>
        <image x="-55" y="-58" width="110" height="120" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,"/>
      </g>

      <text x="0" y="204" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#ffffff">Mayank Jha</text>
      <text x="0" y="228" text-anchor="middle" class="sans" font-size="13" fill="#ff9fe0">Software Engineer &#183; Full Stack</text>
      <text x="0" y="252" text-anchor="middle" class="mono" font-size="12" fill="#c9b8ff">@Mayveno</text>

      <line x1="-120" y1="270" x2="120" y2="270" stroke="#3a2657"/>

      <!-- barcode -->
      <g transform="translate(-110,290)" fill="#e8dcff">
        <rect x="0" y="0" width="2" height="40"/><rect x="5" y="0" width="4" height="40"/><rect x="12" y="0" width="1" height="40"/>
        <rect x="16" y="0" width="3" height="40"/><rect x="22" y="0" width="2" height="40"/><rect x="27" y="0" width="5" height="40"/>
        <rect x="35" y="0" width="1" height="40"/><rect x="39" y="0" width="3" height="40"/><rect x="45" y="0" width="2" height="40"/>
        <rect x="50" y="0" width="4" height="40"/><rect x="57" y="0" width="1" height="40"/><rect x="61" y="0" width="3" height="40"/>
        <rect x="67" y="0" width="2" height="40"/><rect x="72" y="0" width="5" height="40"/><rect x="80" y="0" width="2" height="40"/>
        <rect x="86" y="0" width="1" height="40"/><rect x="90" y="0" width="4" height="40"/><rect x="97" y="0" width="2" height="40"/>
        <rect x="103" y="0" width="3" height="40"/><rect x="110" y="0" width="2" height="40"/><rect x="115" y="0" width="4" height="40"/>
        <rect x="122" y="0" width="1" height="40"/><rect x="126" y="0" width="3" height="40"/><rect x="132" y="0" width="2" height="40"/>
        <rect x="137" y="0" width="4" height="40"/><rect x="144" y="0" width="1" height="40"/><rect x="148" y="0" width="3" height="40"/>
        <rect x="154" y="0" width="2" height="40"/><rect x="159" y="0" width="4" height="40"/><rect x="166" y="0" width="2" height="40"/>
        <rect x="172" y="0" width="3" height="40"/><rect x="178" y="0" width="2" height="40"/><rect x="184" y="0" width="4" height="40"/>
        <rect x="191" y="0" width="1" height="40"/><rect x="195" y="0" width="3" height="40"/><rect x="201" y="0" width="2" height="40"/>
        <rect x="207" y="0" width="4" height="40"/><rect x="214" y="0" width="2" height="40"/><rect x="220" y="0" width="1" height="40"/>
      </g>
      <text x="0" y="356" text-anchor="middle" class="mono" font-size="9" fill="#8a76b8" letter-spacing="3">MB21-DEV-2026</text>

      <!-- holographic shine sweep -->
      <g clip-path="url(#cardClip)">
        <rect x="-320" y="-20" width="140" height="480" fill="url(#shine)" transform="rotate(20)">
          <animate attributeName="x" from="-320" to="380" dur="3.5s" begin="1.6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <clipPath id="cardClip"><rect x="-150" y="0" width="300" height="420" rx="20"/></clipPath>
    </g>
  </g>
</g>
</svg>
